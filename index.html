    ${(d.cash||[]).length ? `<details class="how"><summary>Tüm Kasa Hareketleri (${d.cash.length})</summary>${d.cash.slice(-60).reverse().map(c=>`<div class="row between small krow2"><span>${new Date(Date.parse(c.d)).toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${CASH_T[c.t]||c.t}${c.r?` · ${esc(c.r)}`:""}${c.n?` · ${esc(c.n)}`:""}</span><b class="num">${TLx(c.t==="kapanis" ? (c.say ?? c.a) : c.a)}</b></div>`).join("")}</details>` : ""}</section>`;
  return h;
}
async function rpXlsx(){
  const d = S.rpData; if (!d) return;
  try{
    const X = await loadXLSX(), wb = X.utils.book_new(), T = rpSum(d), per = `${d.from} – ${d.to}`;
    const add = (rows, name, blank) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length ? rows : [blank]), name);
    add([["Dükkân", (S.cloud?.shop?.name || S.settings?.shopName || "")], ["Dönem", per], ["Gruplama", RG[d.g]], ["Toplam satış TL", T.ciro], ["Satış (fiş) sayısı", T.fis], ["Nakit TL", T.nakit], ["Kart TL", T.kart], ["Veresiye TL", T.veresiye], ["İade TL", T.iade],
      ["Maliyet TL (alış fiyatı bilinen)", r2(T.maliyet)], ["Kâr TL (alış fiyatı bilinen)", T.kar], ["Veresiye tahsilatı TL", T.tahsilat], ["Kasaya giriş TL", T.giris], ["Kasadan çıkış TL", T.cikis], ["Hazırlanma", new Date().toLocaleString("tr-TR")]].map(([a,b])=>({"Bilgi":a, "Değer":b})), "Özet", {"Bilgi":""});
    add(d.periods.map(p=>({"Dönem":rpLabel(p.k, d.g), "Başlangıç":p.k, "Fiş":Number(p.fis), "Satış TL":r2(p.ciro), "Nakit TL":r2(p.nakit), "Kart TL":r2(p.kart), "Veresiye TL":r2(p.veresiye), "İade TL":r2(p.iade),
      "Maliyet TL":r2(p.maliyet), "Kâr TL":r2(Number(p.ciro_bilinen) - Number(p.maliyet)), "Veresiye tahsilatı TL":r2(p.tahsilat), "Kasaya giriş TL":r2(p.giris), "Kasadan çıkış TL":r2(p.cikis)})), "Dönemler", {"Dönem":""});
    add((d.products||[]).map(p=>{ const pp = S.products.find(x=>x.id===p.p); return {"Ürün":p.n||"", "Miktar":r3(p.q), "Birim":pp ? unitOf(pp) : "", "Satış TL":r2(p.ciro), "Maliyet TL":p.eksik ? null : r2(p.maliyet), "Kâr TL":p.eksik ? null : r2(Number(p.ciro) - Number(p.maliyet||0)), "Not":p.eksik ? "alış fiyatı yok" : ""}; }), "Ürünler", {"Ürün":""});
    add((d.cash||[]).map(c=>{ const t = new Date(Date.parse(c.d)); return {"Tarih":t.toLocaleDateString("tr-TR"), "Saat":hhmm(t.getTime()), "Tür":CASH_T[c.t]||c.t, "Tutar TL":r2(c.t==="kapanis" ? (c.say ?? c.a) : c.a), "Sebep":c.r||"", "Açıklama":c.n||""}; }), "Kasa hareketleri", {"Tarih":""});
    add((d.reasons||[]).map(r=>({"Tür":r.t==="cikis"?"Kasadan çıkış":"Kasaya giriş", "Sebep":r.r, "Kaç kez":Number(r.adet), "Toplam TL":r2(r.a)})), "Giriş-çıkış sebepleri", {"Tür":""});
    const buf = X.write(wb, {type:"array", bookType:"xlsx"}), name = `satis-raporu-${d.from}_${d.to}.xlsx`, mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    let how;
    if (window.matchMedia && matchMedia("(pointer:fine)").matches && !window.claude?.use){ const url = URL.createObjectURL(new Blob([buf], {type:mime})); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 30000); how = "tried"; }
    else how = await saveFile(name, buf, mime);
    S.msg = how==="cancel" ? null : {kind:"ok", text: how==="shared" ? "Rapor paylaşıldı." : how==="saved" ? "Rapor kaydedildi." : "Rapor indirildi (İndirilenler klasörü)."};
    S.rpLastXlsx = name; render();
  }catch(e){ S.msg = {kind:"bad", text: window.XLSX ? "Excel dosyası hazırlanamadı. Tekrar dene." : "Excel için bir kez internet gerekiyor. İnternet açılınca tekrar bas."}; render(); }
}
async function rpAct(a, t){
  if (a==="rpPre"){ const k = t.dataset.k, r = rpPreset(k), g = (RP_PRE.find(x=>x[0]===k)||[])[2] || "day"; S.rp = {...rpState(), ...r, g, pre:k}; await rpLoad(); return true; }
  if (a==="rpG"){ S.rp = {...rpState(), g:t.dataset.g}; if (S.rpData) await rpLoad(); else render(); return true; }
  if (a==="rpGo"){ const f = document.getElementById("rp-from")?.value, to = document.getElementById("rp-to")?.value; S.rp = {...rpState(), ...(f?{from:f}:{}), ...(to?{to}:{}), pre:null}; await rpLoad(); return true; }
  if (a==="rpXlsx"){ await rpXlsx(); return true; }
  if (a==="goRapor"){ S.tab = "rapor"; S.msg = null; render(); window.scrollTo(0,0); if (!S.rpData) rpLoad(); return true; }
  return false;
}
document.addEventListener("change", ev=>{ if (ev.target.id==="rp-from" || ev.target.id==="rp-to"){ S.rp = {...rpState(), [ev.target.id==="rp-from"?"from":"to"]: ev.target.value, pre:null}; } });


/* ---------- Aşağı çekip yenile ---------- */
(function(){
  const TH = 70; let y0 = null, d = 0, el = null, busy = false;
  function box(){ if (!el){ el = document.createElement("div"); el.id = "ptr"; el.setAttribute("aria-hidden","true");
      el.innerHTML = '<span class="ptr-i">↓</span><span class="ptr-t">Yenilemek için çek</span>'; document.body.appendChild(el); } return el; }
  function hide(){ if (el && !busy){ el.style.transform = "translate(-50%,-70px)"; el.style.opacity = "0"; } }
  const blocked = t => !!(t && t.closest && t.closest("input,textarea,select,.custlist,.tscroll,.posres,.pinpad,dialog"));
  document.addEventListener("touchstart", e=>{
    if (busy || e.touches.length!==1 || (document.scrollingElement||document.documentElement).scrollTop > 0 || blocked(e.target)){ y0 = null; return; }
    y0 = e.touches[0].clientY; d = 0;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if (y0==null) return;
    d = (e.touches[0].clientY - y0) * 0.5;
    if (d <= 0 || (document.scrollingElement||document.documentElement).scrollTop > 0){ hide(); return; }
    const x = box(), k = Math.min(d, 110);
    x.style.transition = "none"; x.style.transform = `translate(-50%,${k-50}px)`; x.style.opacity = String(Math.min(1, k/50));
    x.classList.toggle("go", d >= TH); x.querySelector(".ptr-t").textContent = d >= TH ? "Bırak, yenilensin" : "Yenilemek için çek";
  }, {passive:true});
  document.addEventListener("touchend", ()=>{
    if (y0==null) return; y0 = null;
    if (el) el.style.transition = "";
    if (d < TH){ hide(); return; }
    busy = true; const x = box(); x.classList.add("go"); x.querySelector(".ptr-i").innerHTML = '<span class="spin"></span>'; x.querySelector(".ptr-t").textContent = "Yenileniyor";
    x.style.transform = "translate(-50%,14px)"; x.style.opacity = "1";
    try{ if (typeof cloudSaveNow==="function" && CLOUD_ON) cloudSaveNow(); }catch(_){}
    setTimeout(()=>location.reload(), 250);
  }, {passive:true});
  document.addEventListener("touchcancel", ()=>{ y0 = null; hide(); }, {passive:true});
})();

try{ if (!localStorage.getItem("bd-rehber")){ S.guide=true; S.tab="urunler"; localStorage.setItem("bd-rehber","1"); } }catch(_){}
