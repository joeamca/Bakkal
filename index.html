async function saveInvoice(){
  syncInv();
  const inv = S.inv;
  // Kaydetmeden önce kontrol: hatalı satır varsa form açık kalır, satır işaretlenir
  if (inv.date && inv.date > ymd(Date.now())){ S.invErr = "Fatura tarihi ileri bir gün olamaz. Bugünü ya da geçmiş bir günü seç."; render(); return; }
  let bad = 0;
  for (const l of inv.lines){ l.err = null;
    if (!l.productId) continue;
    const p0 = S.products.find(x=>x.id===l.productId);
    if (l.productId==="__new" && !(l.newName||l.raw||"").trim()) l.err = "Yeni ürünün adını yaz.";
    else if (l.qty==null || isNaN(l.qty)) l.err = "Miktarı yaz.";
    else if (!(l.qty>0)) l.err = "Miktar 0'dan büyük olmalı.";
    else if (p0 && unitOf(p0)==="tane" && !Number.isInteger(l.qty)) l.err = "Adet küsuratlı olamaz; tam sayı yaz.";
    else if (l.price!=null && (isNaN(l.price) || l.price<0)) l.err = "Fiyat eksi olamaz.";
    if (l.err) bad++; }
  if (bad){ S.invErr = `${bad} satırda eksik ya da hatalı bilgi var. Kırmızı yazılı satırları düzelt; girdiklerin silinmedi.`; render(); return; }
  S.invErr = null;
  // K3: "Yeni ürün" adı zaten varsa (adı ya da faturadaki diğer adı) mevcut ürüne ekle
  const merged = [];
  for (const l of inv.lines){ if (l.productId!=="__new") continue;
    const k = norm(l.newName||l.raw||"");
    const ex = S.products.find(x=>!isMade(x) && (norm(x.name)===k || (x.aliases||[]).some(a=>norm(a)===k)));
    if (ex){ l.productId = ex.id; if (!merged.includes(ex.name)) merged.push(ex.name); } }
  const madeNow = {};
  const before = {};
  for (const l of inv.lines){ const p0 = S.products.find(x=>x.id===l.productId); if (p0 && !before[p0.id]){ const st0 = stats(p0); const rows0 = movements(p0, st0); const nr = rows0[rows0.length-1];
    before[p0.id] = {name:p0.name, days:nr.days, minus: nr.sold+nr.fire+nr.iade, shelf: nr.before, add:0}; } }
  const date = !inv.date || inv.date===ymd(Date.now()) ? nowIso() : new Date(inv.date+"T12:00:00").toISOString();
  const invKey = newId(), created = [];
  let n = 0;
  for (const l of inv.lines){
    if (!l.productId || !(l.qty>0)) continue;
    let p;
    if (l.productId==="__new" && madeNow[norm(l.newName||l.raw||"")]){ p = madeNow[norm(l.newName||l.raw||"")]; }
    else if (l.productId==="__new"){
      const name = (l.newName||l.raw||"").trim(); if (!name) continue;
      p = {id:newId(), name, supplier:inv.supplier, caseSize:l.caseSize||1, intervalDays:7, perishable:false,
           initialWeekly:l.qty, createdAt:nowIso(), aliases: l.raw ? [l.raw] : [], outSince:null, createdByInv:invKey, buyPrice:l.price||null};
      await store.saveProduct(p); created.push(p.id); madeNow[norm(name)] = p;
    } else {
      p = {...S.products.find(x=>x.id===l.productId)};
      let changed = false;
      if (l.raw && !(p.aliases||[]).some(a=>norm(a)===norm(l.raw)) && norm(l.raw)!==norm(p.name)){ p.aliases=[...(p.aliases||[]), l.raw].slice(-8); changed=true; }
      if (!p.supplier && inv.supplier){ p.supplier = inv.supplier; changed = true; }
      if (!l.iade && p.outSince){
        const d = Math.max(0,(new Date(date).getTime()-new Date(p.outSince).getTime())/DAY);
        await store.addEvent({type:"bos", productId:p.id, days:Math.round(d*10)/10, qty:0, date, invKey, outSince:p.outSince});
        p.outSince = null; changed = true;
      }
      if (changed) await store.saveProduct(p);
    }
    await store.addEvent({type: l.iade?"iade":"gelen", productId:p.id, qty:l.qty, price:l.price||null, invoiceNo:inv.no||null, supplier:inv.supplier||null, date, invKey});
    if (!l.iade){ (before[p.id] ||= {name:p.name, days:null, minus:null, shelf:null, add:0}).add += l.qty; }
    n++;
  }
  S.inv = null;
  S.invSummary = Object.values(before).filter(x=>x.add>0);
  if (created.length) S.newProds = {ids:created, sup:inv.supplier||""};
  if (n) offerUndo(`Fatura kaydedildi (${n} kalem).`, ()=>deleteInvoice(invKey));
  S.msg = {kind:"ok", text: (n ? `Fatura kaydedildi: ${n} kalem.` : "Kaydedilecek kalem yoktu. Ürün seçip miktar girilen satırlar kaydedilir.") + (merged.length ? ` Bu ürünler zaten vardı, yeni kart açılmadı, mevcut ürüne eklendi: ${merged.join(", ")}.` : "")};
  S.tab = n ? "siparis" : "fatura"; render();
}

async function saveFire(){
  const date = nowIso(), added = [], wrong = [];
  for (const p of S.products){ const raw = document.getElementById("fire-"+p.id)?.value; if (raw==null || raw==="") continue;
    const q = Number(String(raw).replace(",",".")); if (isNaN(q) || q<0 || (unitOf(p)==="tane" && !Number.isInteger(q))) wrong.push(p.name); }
  if (wrong.length){ S.msg={kind:"bad",text:`Şu ürünlerde fire adedi hatalı (eksi ya da küsuratlı olamaz): ${wrong.join(", ")}. Düzeltip tekrar kaydet.`}; render(true); window.scrollTo(0,0); return; }
  for (const p of S.products){
    const q = Number(String(document.getElementById("fire-"+p.id)?.value||0).replace(",","."));
    if (!(q>0)) continue;
    const why = document.getElementById("fwhy-"+p.id)?.value || "tarih";
    const note = (document.getElementById("fnote-"+p.id)?.value || "").trim();
    added.push({id:newId(), type: why==="ariza" ? "ariza" : "fire", reason:why, note: note||null, productId:p.id, qty:q, date});
  }
  S.fireImpact = added.map(e=>{
    const p = S.products.find(x=>x.id===e.productId), b = stats(p), a = stats(p, added);
    return {name:p.name, perishable:p.perishable, why:e.reason, qty:e.qty, b, a};
  });
  for (const e of added) await store.addEvent(e);
  if (!added.length) await store.addEvent({type:"fireyok", productId:"-", qty:0, date});
  if (added.length) offerUndo(`Fire kaydedildi (${added.length} ürün).`, async ()=>{ for (const e of added) await store.deleteEvent(e.id); S.fireImpact=null; render(); });
  S.msg = {kind:"ok", text: added.length ? `Fire kaydedildi: ${added.length} ürün. Kutuyu boşaltabilirsin.` : "Bu hafta fire yok olarak kaydedildi."};
  render(); window.scrollTo(0,0);
}

function fireImpactCard(){
  if (!S.fireImpact || !S.fireImpact.length) return "";
  const rows = S.fireImpact.map(x=>{
    const {a,b} = x; let tip = "";
    if (!a.hasData) tip = "Henüz bu ürünün faturası girilmediği için tahmin değişmedi. İlk faturadan sonra fire hesaba katılır.";
    else if (x.why==="ariza") tip = "Arıza tek seferlik sayılır; fire oranını yükseltmez.";
    else if (x.why==="hasar") tip = "Hasar genelde fazla siparişten değil taşımadan veya raftan olur. Sık tekrarlanırsa tedarikçiyle konuş.";
    else if (x.perishable && a.fireRate>=0.15) tip = "Fire yüksek. Daha sık ama daha az sipariş vermeyi dene: Ürünler'den sipariş aralığını kısaltabilirsin.";
    else if (x.perishable) tip = "Fire makul seviyede.";
    return `<div class="item"><div class="name">${esc(x.name)}
        <div class="small muted">Haftalık satış tahmini <span class="num">${fmt(b.weekly,1)} → ${fmt(a.weekly,1)}</span>${a.hasData?` · fire oranı <span class="num">%${fmt(a.fireRate*100)}</span>`:""}</div>
        ${x.perishable && a.expFire>0 ? `<div class="small muted">Bu siparişte yaklaşık <span class="num">${a.expFire}</span> adet bozulması bekleniyor.</div>`:""}
        ${tip?`<div class="small" style="margin-top:4px">${esc(tip)}</div>`:""}</div>
      <div class="qty">${fmt(a.q)}<small>${a.q<b.q?`önce ${fmt(b.q)}`:a.q>b.q?`önce ${fmt(b.q)}`:"değişmedi"}</small></div></div>`;
  }).join("");
  return `<section class="card stack"><div class="row between"><h2>Firenin etkisi</h2><button class="link" data-act="closeImpact">Kapat</button></div>
    <p class="small muted">Bozulan ürün satılmış sayılmaz. Tahmin buna göre yeniden hesaplandı; sağdaki rakam yeni sipariş önerisi.</p>${rows}</section>`;
}

function orderText(sup){
  const list = stockP().filter(p => (p.supplier||"Tedarikçi belirtilmemiş")===sup)
    .map(p=>({p,st:stats(p)})).filter(x=>x.st.q>0).sort((a,b)=>a.p.name.localeCompare(b.p.name,"tr"));
  const sch = schedule(sup==="Tedarikçi belirtilmemiş"?"":sup);
  return `Sipariş - ${sup}${sch?` (teslim: ${DN[sch.next]})`:""}\n` + list.map(x=>`- ${x.p.name}: ${x.st.q} ${x.p.unit==="kg"?"kg":"adet"}${x.st.cases?` (${x.st.cases} koli${x.st.caseRem?` + ${x.st.caseRem}`:""})`:""}`).join("\n");
}

  const P = root.collection("products"), E = root.collection("events"), T = root.collection("suppliers"), M = root.collection("meta").doc("ayarlar"), CU = root.collection("customers");

  const st = {

    async addEvent(e){ const id = e.id || newId(); const {id:_x, ...body} = e; S.events.push({...body,id}); renderData(); bg(E.doc(id).set(body)); },
    async deleteEvent(id){ S.events=S.events.filter(x=>x.id!==id); renderData(); bg(E.doc(id).delete()); },

    async saveSettings(x){ S.settings=x; renderData(); bg(M.set(x)); },

    refs:{P,E,T,M,CU}
  };
  setStore(st);

const EMAIL_RE = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
const normEmail = e => String(e||"").trim().toLowerCase();
const loginEmail = x => String(x||"").includes("@") ? normEmail(x) : toEmail(x);
// E-postadaki "şifremi unuttum" bağlantısıyla mı gelindi? (kütüphane adres çubuğunu temizlemeden önce bakılır)
const RECOVERY = /type=recovery/.test(location.hash);
const LINK_ERR = /error_code=|error=access_denied/.test(location.hash);
const ROLE = {owner:"dükkân sahibi", staff:"çalışan"};
const WORDS = ["simit","elma","armut","zeytin","peynir","limon","incir","nane","kiraz","ceviz","findik","lokum"];
const genPass = () => WORDS[Math.floor(Math.random()*WORDS.length)] + "-" + String(1000 + Math.floor(Math.random()*9000));
const agoShort = t => { if (!t) return "hiç girmedi"; const m = (Date.now()-new Date(t).getTime())/60000; return m<2 ? "şimdi" : m<60 ? `${Math.round(m)} dk önce` : m<1440 ? `${Math.round(m/60)} saat önce` : `${Math.round(m/1440)} gün önce`; };
const sbMsg = e => { const m = String(e?.message||e||""); return /fetch|network|Load failed|NetworkError/i.test(m) ? "İnternet bağlantısı yok. Bağlanınca tekrar dene." : m.replace(/^.*?ERROR:\s*/,""); };
const isNetErr = e => /fetch|network|Load failed|NetworkError|timeout/i.test(String(e?.message||e||"")) || (!e?.code && !e?.status);

function cloudSave(){ clearTimeout(cloudSave.t); cloudSave.t = setTimeout(cloudSaveNow, 150); }
function cloudSaveNow(){ clearTimeout(cloudSave.t); if (!C.user) return; try{ localStorage.setItem(BKEY, JSON.stringify({uid:C.user.id, admin:!!S.admin, ctx:C.ctx, shop:C.shop, queue:C.queue, lastSync:C.lastSync, by:C.by, people:C.people,
  posOld:C.posOld||null, data:{products:S.products.map(({showCount,...x})=>x), events:S.events, suppliers:S.suppliers, customers:S.customers, settings:S.settings, sales:S.sales, cash:S.cash}})); }catch(_){} }
function cloudRead(){ try{ return JSON.parse(localStorage.getItem(BKEY)||"null"); }catch(_){ return null; } }
window.addEventListener("pagehide", ()=>{ if (CLOUD_ON) cloudSaveNow(); });

function loadSB(){
  if (window.supabase?.createClient) return Promise.resolve();
  return new Promise((res,rej)=>{ const s = document.createElement("script"); s.src = CLOUD.lib; s.onload = res; s.onerror = ()=>{ s.remove(); rej(new Error("NetworkError: kütüphane yüklenemedi")); }; document.head.appendChild(s); });
}
function client(){
  if (!SB){ SB = window.supabase.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"bd-oturum"}});
    SB.auth.onAuthStateChange((ev)=>{ if (ev==="SIGNED_OUT" && C.user && !C.leaving){ C.loginErr = "Oturumun kapandı. Tekrar giriş yap."; resetCloud(false); } }); }
  return SB;
}

/* --- kayıt kuyruğu: önce telefona, sonra internete --- */
const strip = o => { const {showCount, ...x} = o||{}; return x; };
function put(kind, id, data, deleted){
  if (!C.shop){ S.msg = {kind:"bad", text:"Önce bir dükkân seç."}; return; }
  C.queue = C.queue.filter(q=>!(q.kind===kind && q.id===id && q.shop===C.shop.id));
  C.queue.push({shop:C.shop.id, kind, id:String(id), data: deleted ? {} : strip(data), deleted:!!deleted});
  cloudSave(); saving(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 250);
}
async function flush(){
  clearTimeout(flushTimer);
  if (C.flushing || !SB || !C.user || !C.shop) { saving(); return; }
  const mine = C.queue.filter(q=>q.shop===C.shop.id);
  if (!mine.length){ saving(); return; }
  C.flushing = true; saving();
  const batch = mine.slice(0, 200);
  try{
    const {error} = await SB.from("docs").upsert(batch.map(q=>({shop_id:q.shop, kind:q.kind, id:q.id, data:q.data, deleted:q.deleted})));
    if (error) throw error;
    C.queue = C.queue.filter(q=>!batch.includes(q)); C.err = null; C.online = true; cloudSave();
  }catch(e){
    if (isNetErr(e)){ C.online = false; flushTimer = setTimeout(flush, 15000); }
    else { C.err = e; S.msg = {kind:"bad", text:"Kayıt internete gönderilemedi: " + sbMsg(e) + (e.code==="42501" ? " Dükkânın hesabı durdurulmuş ya da bu dükkândan çıkarılmış olabilirsin." : "") + " Kayıtlar telefonda duruyor; bir dakika sonra yeniden denenecek."}; render(); flushTimer = setTimeout(()=>{ C.err = null; flush(); }, 60000); }
  }finally{ C.flushing = false; saving(); }
  if (!C.err && C.online && C.queue.some(q=>q.shop===C.shop?.id)) flush();
}
function cloudStore(){
  const upd = (arr, x) => { const i = arr.findIndex(y=>y.id===x.id); if (i>=0) arr[i] = x; else arr.push(x); };
  return {
    async saveProduct(p){ upd(S.products, {...p}); put("product", p.id, p); renderData(); },
    async deleteProduct(id){ S.products = S.products.filter(x=>x.id!==id); put("product", id, null, true); renderData(); },
    async addEvent(e){ const x = {...e, id:e.id||newId()}; S.events.push(x); put("event", x.id, x); renderData(); },
    async deleteEvent(id){ S.events = S.events.filter(x=>x.id!==id); put("event", id, null, true); renderData(); },
    async saveSupplier(x){ S.suppliers = {...S.suppliers, [x.id]:x}; put("supplier", x.id, x); renderData(); },
    async saveSettings(x){ S.settings = x; put("settings", "main", x); renderData(); },
    async saveCustomer(x){ S.customers = {...S.customers, [x.id]:x}; put("customer", x.id, x); renderData(); },
    async deleteCustomer(id){ const c = {...S.customers}; delete c[id]; S.customers = c; put("customer", id, null, true); renderData(); },
    async saveSale(x){ upd(S.sales, {...x}); salesTouch(); put("sale", x.id, x); renderData(); },
    async saveCash(x){ upd(S.cash, {...x}); put("cash", x.id, x); renderData(); },
    async deleteCash(id){ S.cash = S.cash.filter(x=>x.id!==id); put("cash", id, null, true); renderData(); }
  };
}

/* --- sunucudan gelen satırı uygula --- */
function applyRow(r){
  if (!r || !C.shop || r.shop_id!==C.shop.id) return;
  if (!C.lastSync || r.updated_at > C.lastSync) C.lastSync = r.updated_at;
  if (C.queue.some(q=>q.shop===r.shop_id && q.kind===r.kind && q.id===r.id)) return; // telefondaki daha yeni
  if (r.updated_by) C.by[r.kind+":"+r.id] = r.updated_by;
  const d = r.deleted ? null : r.data;
  const inArr = (arr) => { const i = arr.findIndex(x=>x.id===r.id); if (!d){ if (i>=0) arr.splice(i,1); } else { const v = {...d, id:r.id}; if (i>=0){ if (arr[i].showCount) v.showCount = true; arr[i] = v; } else arr.push(v); } };
  if (r.kind==="product") inArr(S.products);
  else if (r.kind==="event") inArr(S.events);
  else if (r.kind==="sale"){ inArr(S.sales); salesTouch(); }
  else if (r.kind==="cash") inArr(S.cash);
  else if (r.kind==="supplier" || r.kind==="customer"){ const key = r.kind==="supplier" ? "suppliers" : "customers"; const o = {...S[key]}; if (d) o[r.id] = {...d, id:r.id}; else delete o[r.id]; S[key] = o; }
  else if (r.kind==="settings" && d){ S.settings = {...d}; S.settingsFromDb = true; }
}
async function pull(){
  const size = 1000; let n = 0; const since = C.lastSync, cut = new Date(posCutoffT()).toISOString();
  // Satışlar çok olur: telefona sadece son günlerinkini al; eskiler sunucuda toplanır (raporlar, stok)
  for (const part of ["main", "sale"]){
    let from = 0;
    for (;;){
      let q = SB.from("docs").select("shop_id,kind,id,data,deleted,updated_at,updated_by").eq("shop_id", C.shop.id);
      q = part==="main" ? q.neq("kind", "sale") : q.eq("kind", "sale").gte("data->>d", cut);
      if (since) q = q.gte("updated_at", since);
      const {data, error} = await q.order("updated_at", {ascending:true}).order("kind").order("id").range(from, from+size-1);
      if (error) throw error;
      data.forEach(applyRow); n += data.length;
      if (data.length < size) break; from += size;
    }
  }
  prunePos(); C.online = true; cloudSave(); return n;
}
function subscribe(){
  try{
    if (RT) SB.removeChannel(RT);
    RT = SB.channel("docs-"+C.shop.id).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"shop_id=eq."+C.shop.id},
      p=>{ applyRow(p.new); cloudSave(); renderData(); }).subscribe();
  }catch(_){}
}
async function loadPeople(){ if (!C.shop || !SB) return; try{ const {data, error} = await SB.rpc("shop_members", {p_shop:C.shop.id}); if (!error){ C.people = data||[]; C.peopleAt = Date.now(); cloudSave(); } }catch(_){} }
const whoName = uid => { const p = C.people.find(x=>x.user_id===uid); return p ? (p.full_name || p.username) : null; };
// "kim girdi" etiketi: dükkânda birden fazla kişi varsa gösterilir
const whoTag = (kind, id) => { if (S.mode!=="cloud" || C.people.length < 2) return ""; const n = whoName(C.by[kind+":"+id]); return n ? ` · <span class="who">${esc(n)}</span>` : ""; };

/* --- stok için eski satışların toplamı (telefonda tutulmayan) --- */
async function posOldEnsure(){
  if (!POS_NEED.size || C.posOldBusy || !SB || !C.shop || S.mode!=="cloud" || C.online===false) return;
  const cut = new Date(posCutoffT()).toISOString();
  if (!C.posOld || C.posOld.cut!==cut) C.posOld = {cut, v:{}};
  const keys = [...POS_NEED].filter(k=>C.posOld.v[k]==null).slice(0, 2000); POS_NEED.clear();
  if (!keys.length) return;
  C.posOldBusy = true;
  try{
    const req = keys.map(k=>{ const i = k.lastIndexOf("|"); return {k, p:k.slice(0,i), s:k.slice(i+1)}; });
    const {data, error} = await SB.rpc("pos_sold", {p_shop:C.shop.id, p_req:req, p_until:cut});
    if (error) throw error;
    for (const k of keys) C.posOld.v[k] = Number((data||{})[k]) || 0;
    cloudSave(); renderData();
  }catch(e){ keys.forEach(k=>POS_NEED.add(k)); }
  C.posOldBusy = false;
}
setInterval(()=>{ if (CLOUD_ON) posOldEnsure(); }, 2500);

/* --- açılış, giriş, çıkış --- */
async function cloudBoot(){
  const c = RECOVERY ? null : cloudRead();
  C.recovery = RECOVERY;
  if (LINK_ERR){ C.loginErr = "Şifre yenileme bağlantısının süresi dolmuş ya da daha önce kullanılmış. \"Şifremi unuttum\"a basıp yeni bağlantı iste."; try{ history.replaceState(null, "", SITE()); }catch(_){} }
  if (c && c.uid && (c.shop || c.admin)){
    C.user = {id:c.uid}; C.ctx = c.ctx; C.shop = c.shop; C.queue = c.queue||[]; C.lastSync = c.lastSync||null; C.by = c.by||{}; C.people = c.people||[];
    const d = c.data||{}; S.products = d.products||[]; S.events = d.events||[]; S.suppliers = d.suppliers||{}; S.customers = d.customers||{}; if (d.settings) S.settings = d.settings;
    S.sales = d.sales||[]; S.cash = d.cash||[]; C.posOld = c.posOld||null; salesTouch(); prunePos();
    setStore(cloudStore()); S.mode = c.ctx?.must_change ? "newpass" : c.ctx?.has_pin===false ? "setpin" : c.shop?.active===false ? "paused" : "cloud";
    if (c.admin){ S.admin = true; C.shop = null; C.ready = true; S.guide = false; if (!String(S.tab).startsWith("y-")) S.tab = "y-ozet"; }
    checkLock(true); render(); saving();
  } else { S.mode = "loading"; render(); }
  try{ await loadSB(); }
  catch(e){
    if (S.mode==="cloud"){ C.online = false; saving(); window.addEventListener("online", ()=>{ loadSB().then(()=>{ client(); resync(); }, ()=>{}); }, {once:true}); return; }
    S.mode = "login"; C.loginErr = "İnternet bağlantısı yok. İlk giriş için internet gerekiyor."; render(); window.addEventListener("online", ()=>cloudBoot(), {once:true}); return;
  }
  client();
  let session = null; try{ session = (await SB.auth.getSession()).data.session; }catch(_){}
  if (RECOVERY) try{ history.replaceState(null, "", SITE()); }catch(_){}
  if (!session){ C.recovery = false; if (RECOVERY && !LINK_ERR) C.loginErr = "Şifre yenileme bağlantısı açılamadı. \"Şifremi unuttum\"a basıp yeni bağlantı iste.";
    if (S.mode!=="cloud" || !C.user){ S.mode = "login"; render(); } else { C.online = false; saving(); } return; }
  if (C.recovery) markActive(true);
  try{ await afterLogin(session.user); }
  catch(e){ if (isNetErr(e) && S.mode==="cloud"){ C.online = false; saving(); } else { C.loginErr = sbMsg(e); S.mode = "login"; render(); } }
}
async function afterLogin(user){
  if (C.user && C.user.id!==user.id){ const keep = {loginErr:null}; C = Object.assign(newC(), keep); S.cloud = C; clearData(); }
  C.user = {id:user.id};
  const {data:ctx, error} = await SB.rpc("my_context"); if (error) throw error;
  if (!ctx) throw new Error("Hesap bilgisi bulunamadı. Yöneticiye haber ver.");
  C.ctx = ctx; SB.rpc("touch").then(()=>{}, ()=>{});
  if (C.recovery){ S.locked = false; S.mode = "recover"; render(); return; }      // e-postadaki bağlantıyla geldi: yeni şifre
  if (ctx.must_change){                                           // tek kullanımlık şifre: önce kendi şifresini koysun
    if (!(ctx.temp_left > 0) && ctx.temp_left !== undefined && ctx.temp_left !== null){ C.loginErr = "Tek kullanımlık şifrenin 5 dakikalık süresi doldu. Yöneticiden ya da dükkân sahibinden yeni şifre iste."; await doLogout(true); return; }
    C.tempDeadline = ctx.temp_left > 0 ? Date.now() + ctx.temp_left*1000 : null; S.mode = "newpass"; render(); return; }
  pinSync();
  if (ctx.has_pin === false || (ctx.has_pin && needRenew())){ S.locked = false; S.mode = "setpin"; render(); return; }   // ilk kullanımda (ya da PIN unutulunca) PIN zorunlu
  try{ if (localStorage.getItem(RENEW_KEY)) setRenew(false); }catch(_){}
  if (ctx.is_admin && adminView()!=="shop"){ enterAdmin(); return; }               // yönetici: kendi ekranı (bakkal ekranı değil)
  S.admin = false;
  const shops = ctx.shops||[];
  let pick = shops.find(s=>s.id===C.shop?.id) || null;
  try{ if (!pick){ const last = localStorage.getItem("bd-son-dukkan"); pick = shops.find(s=>s.id===last) || null; } }catch(_){}
  if (!pick && shops.length===1) pick = shops[0];
  if (!pick){
    if (shops.length>1){ S.mode = "pickshop"; render(); return; }
    if (ctx.is_admin){ enterAdmin(); return; }
    S.mode = "noshop"; render(); return;
  }
  await openShop(pick);
}
function clearData(){ S.sales = []; S.cash = []; salesTouch(); if (C) C.posOld = null; S.products = []; S.events = []; S.suppliers = {}; S.customers = {}; S.settings = {dayW:[1,1,1,1,1,1,1], bigText:true}; S.settingsFromDb = false; }
async function openShop(sh){
  if (C.shop && C.shop.id!==sh.id){ clearData(); C.lastSync = null; C.by = {}; C.people = []; }
  C.shop = sh; try{ localStorage.setItem("bd-son-dukkan", sh.id); }catch(_){}
  if (!sh.active){ S.mode = "paused"; render(); return; }
  setStore(cloudStore()); S.mode = "cloud"; render();
  try{ await pull(); }catch(e){ if (isNetErr(e)) C.online = false; else { S.msg = {kind:"bad", text:"Kayıtlar alınamadı: " + sbMsg(e)}; } }
  const L = readLocal(); if (L && (L.products.length || L.events.length || Object.keys(L.customers||{}).length)) S.localPending = L;
  subscribe(); C.ready = true; flush(); loadPeople().then(()=>renderData()); cloudSaveNow(); render(); saving();
}
async function doLogin(){
  const raw = String(document.getElementById("lg-user")?.value||"").trim(), u = raw.includes("@") ? normEmail(raw) : normUser(raw), p = document.getElementById("lg-pass")?.value || "";
  if (!u || !p){ C.loginErr = "Kullanıcı adını ve şifreni yaz."; render(); return; }
  C.busy = true; C.loginErr = null; render();
  try{
    await loadSB(); client();
    const {data, error} = await SB.auth.signInWithPassword({email: loginEmail(u), password: p});
    if (error) throw error;
    C.busy = false; markActive(true); await afterLogin(data.user);
  }catch(e){
    C.loginErr = /invalid login|invalid_credentials|Invalid/i.test(e?.message||"") ? (u.includes("@") ? "E-posta ya da şifre yanlış." : "Kullanıcı adı ya da şifre yanlış.") : sbMsg(e);
    if (SB && /yanlış/.test(C.loginErr)){ try{ const {data:st} = await SB.rpc("signup_status", {p_username:u});
      if (st==="pending") C.loginErr = "Başvurun henüz onaylanmadı. Onaylanınca telefonuna haber gelecek; sonra bu kullanıcı adı ve şifreyle girebilirsin.";
      else if (st==="rejected") C.loginErr = "Başvurun onaylanmadı. Bilgi için yöneticiyle görüş.";
      else if (!u.includes("@")){ const {data:h} = await SB.rpc("login_hint", {p_login:u}); if (h) C.loginErr = `Bu hesap e-postayla giriş yapıyor (${h}). Kullanıcı adı yerine e-posta adresini yaz.`; } }catch(_){} }
    S.mode = "login";
  }
  C.busy = false; render();
}
async function doSignup(){
  const g = k => (document.getElementById(k)?.value || "").trim();
  const f = {shop:g("sg-shop"), name:g("sg-name"), phone:g("sg-phone"), email:normEmail(g("sg-email")), pass:document.getElementById("sg-pass")?.value||"", pass2:document.getElementById("sg-pass2")?.value||"", note:g("sg-note")};
  S.sgForm = {...f, pass:"", pass2:""};
  const err = t => { C.signupErr = t; render(true); window.scrollTo(0,0); };
  if (g("sg-web")) { S.signup = "done"; S.sgUser = f.email; render(); return; }            // bot tuzağı
  if (!f.shop) return err("Dükkânının adını yaz.");
  if (!f.name) return err("Adını soyadını yaz.");
  if (!EMAIL_RE.test(f.email)) return err("E-posta adresini doğru yaz (örn. mert@gmail.com). Girişte ve şifreni unutunca bu kullanılacak.");
  if (f.phone.replace(/\D/g,"").length < 10) return err("Telefon numaranı yaz; onaylanınca sana buradan haber verilecek.");
  if (f.pass.length < 8) return err("Şifre en az 8 karakter olmalı.");
  if (f.pass !== f.pass2) return err("İki şifre aynı değil.");
  if (!document.getElementById("sg-ok")?.checked) return err("Devam etmek için bilgilerinin saklanmasını onayla.");
  C.busy = true; C.signupErr = null; render(true);
  try{
    await loadSB(); client();
    const {error} = await SB.rpc("request_signup", {p_shop_name:f.shop, p_full_name:f.name, p_email:f.email, p_password:f.pass, p_phone:f.phone||null, p_note:f.note||null});
    if (error) throw error;
    S.signup = "done"; S.sgUser = f.email; S.sgForm = null;
  }catch(e){ C.signupErr = sbMsg(e); }
  C.busy = false; render(); window.scrollTo(0,0);
}
async function doForgot(){
  const e = normEmail(document.getElementById("fg-email")?.value);
  if (!EMAIL_RE.test(e)){ C.loginErr = "Hesabına kayıtlı e-posta adresini yaz."; render(true); return; }
  C.busy = true; C.loginErr = null; render(true);
  try{
    await loadSB(); client();
    const {error} = await SB.auth.resetPasswordForEmail(e, {redirectTo: SITE()});
    if (error && /rate|limit|seconds/i.test(error.message||"")) throw new Error("Çok sık denendi. Birkaç dakika sonra tekrar dene.");
    if (error && isNetErr(error)) throw error;
    S.forgot = "sent"; S.fgEmail = e;
  }catch(err){ C.loginErr = sbMsg(err); }
  C.busy = false; render();
}
function resetCloud(clearCache){
  if (RT && SB) try{ SB.removeChannel(RT); }catch(_){} RT = null;
  if (clearCache) try{ localStorage.removeItem(BKEY); }catch(_){}
  const msg = C.loginErr; C = newC(); C.loginErr = msg; S.cloud = C; clearData(); S.mode = "login"; S.tab = "ana"; S.forgot = null; S.locked = false; S.pinForgot = false; S.pinCoolUntil = 0; S.pinSetup = false; render();
}
async function doLogout(force){
  if (C.queue.length && !force){ S.confirmOut = true; render(); return; }
  S.confirmOut = false; C.leaving = true; pinSave(null);
  try{ await SB?.auth.signOut({scope:"local"}); }catch(_){}
  resetCloud(true);
}

/* --- PIN: hesaba özel (her telefonda aynı). Sunucuda şifrelenmiş saklanır ve orada doğrulanır;
       internet yokken açabilmek için telefonda da şifrelenmiş (PBKDF2) bir kopyası tutulur. --- */
const ACT_KEY = "bd-son-hareket", RENEW_KEY = "bd-pin-yenile", PIN_MAX = 5, PIN_COOL = 5*60000, COLD_LOCK = 60000;
const pinKey = () => C.user ? "bd-pin-" + C.user.id : null;
function pinCfg(){ try{ const k = pinKey(); return k ? JSON.parse(localStorage.getItem(k) || "null") : null; }catch(_){ return null; } }
function pinSave(cfg){ try{ const k = pinKey(); if (!k) return; if (cfg) localStorage.setItem(k, JSON.stringify(cfg)); else localStorage.removeItem(k); }catch(_){} }
async function pinHash(pin, salt){
  const enc = new TextEncoder(), key = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:enc.encode(salt), iterations:150000}, key, 256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function pinRemember(pin, setAt){ try{ const salt = crypto.getRandomValues(new Uint32Array(4)).join("-"); pinSave({salt, hash: await pinHash(pin, salt), setAt, fails:0, coolUntil:0}); }catch(_){} }
// Sunucudaki PIN değiştiyse (başka telefonda) eski kopyayı at
function pinSync(){ const cfg = pinCfg(); if (cfg && (!C.ctx?.has_pin || !sameT(cfg.setAt, C.ctx.pin_set_at))) pinSave(null); }
const sameT = (a, b) => !!a && !!b && Date.parse(String(a).replace(" ","T").replace(/([+-]\d\d)$/,"$1:00")) === Date.parse(String(b).replace(" ","T").replace(/([+-]\d\d)$/,"$1:00"));
const pinMins = () => Number(C.ctx?.pin_mins) || 60;
const pinOn = () => !!C.ctx?.has_pin;
const needRenew = () => { try{ return localStorage.getItem(RENEW_KEY) === C.user?.id; }catch(_){ return false; } };
function setRenew(on){ try{ if (on && C.user) localStorage.setItem(RENEW_KEY, C.user.id); else localStorage.removeItem(RENEW_KEY); }catch(_){} }
function markActive(force){ const n = Date.now(); if (!force && n - (markActive.last||0) < 10000) return; markActive.last = n; try{ localStorage.setItem(ACT_KEY, String(n)); }catch(_){} }
function lastActive(){ try{ return Number(localStorage.getItem(ACT_KEY)) || 0; }catch(_){ return 0; } }
function lockNow(){ S.locked = true; S.pinBuf = ""; S.pinErr = null; S.pinForgot = false; render(); }
// cold: uygulama yeni açıldı → 1 dakikadan uzun kapalı kaldıysa PIN sor
function checkLock(cold){
  if (S.locked && S.pinCoolUntil && S.pinCoolUntil <= Date.now()){ S.pinCoolUntil = 0; render(); return; }
  if (S.mode!=="cloud" || S.locked || !pinOn()) return;
  if (Date.now() - lastActive() > (cold ? COLD_LOCK : pinMins()*60000)) lockNow();
}
["pointerdown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, ()=>{ if (S.mode==="cloud" && !S.locked) markActive(); }, {passive:true, capture:true}));
setInterval(()=>checkLock(false), 15000);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkLock(false); });
const PIN_MINS = [[15,"15 dakika"],[30,"30 dakika"],[60,"1 saat"],[240,"4 saat"]];
const minsLabel = m => (PIN_MINS.find(x=>x[0]===m)||[0,m+" dakika"])[1];
function weakPin(p){ if (/^(\d)\1{3}$/.test(p)) return true; const d = [...p].map(Number);
  return d.every((x,i)=>!i || x===d[i-1]+1) || d.every((x,i)=>!i || x===d[i-1]-1); }
function pinCheck(p1, p2){
  if (!/^\d{4}$/.test(p1)) return "PIN 4 rakam olmalı.";
  if (p1!==p2) return "İki PIN aynı değil.";
  if (weakPin(p1)) return "Bu PIN kolay tahmin edilir (1111, 1234 gibi). Başka 4 rakam seç.";
  return null;
}

async function savePin(p1, mins){
  const {data, error} = await SB.rpc("set_my_pin", mins ? {p_pin:p1, p_mins:mins} : {p_pin:p1});
  if (error) throw error;
  C.ctx = Object.assign(C.ctx||{}, {has_pin:true, pin_set_at:data, pin_mins: mins || pinMins()});
  await pinRemember(p1, data); setRenew(false); markActive(true); cloudSave();
}
async function pinFail(cfg, msgLeft){
  S.pinErr = `PIN yanlış. ${msgLeft} hakkın kaldı.`; render();
}
async function pinTooMany(){
  if (C.queue.length){ S.pinCoolUntil = Date.now() + PIN_COOL; S.pinErr = null; render(); return; }   // kayıt kaybolmasın: çıkış yerine beklet
  setRenew(true); C.loginErr = "5 kez yanlış PIN girildi. Güvenlik için çıkış yapıldı; kullanıcı adın ve şifrenle gir, sonra yeni PIN seç."; await doLogout(true);
}
async function pinAct(a, t){
  if (a==="pinGateSave"){
    const p1 = document.getElementById("pin-1").value, p2 = document.getElementById("pin-2").value, mins = Number(document.getElementById("pin-mins")?.value)||60;
    const bad = pinCheck(p1, p2); if (bad){ C.loginErr = bad; render(); return true; }
    t.disabled = true;
    try{ await savePin(p1, mins); C.loginErr = null; S.msg = {kind:"ok", text:`PIN kaydedildi. Uygulama ${minsLabel(mins)} kullanılmazsa PIN sorulacak.`}; await afterLogin({id:C.user.id}); }
    catch(e){ C.loginErr = sbMsg(e); render(); }
    return true; }
  if (a==="pinSetupOpen"){ S.pinSetup = true; render(true); document.getElementById("pin-1")?.focus(); return true; }
  if (a==="pinSetupCancel"){ S.pinSetup = false; render(); return true; }
  if (a==="pinSetupSave"){
    const p1 = document.getElementById("pin-1").value, p2 = document.getElementById("pin-2").value;
    const bad = pinCheck(p1, p2); if (bad){ S.msg = {kind:"bad", text:bad}; render(true); window.scrollTo(0,0); return true; }
    t.disabled = true;
    try{ await savePin(p1, null); S.pinSetup = false; S.msg = {kind:"ok", text:"PIN değişti. Bütün telefonlarında yeni PIN geçerli."}; }
    catch(e){ S.msg = {kind:"bad", text: isNetErr(e) ? "PIN değiştirmek için internet gerekiyor." : sbMsg(e)}; }
    render(); window.scrollTo(0,0); return true; }
  if (a==="pinLockNow"){ if (pinOn()) lockNow(); return true; }
  if (a==="pinForgot"){ if (C.queue.length){ S.pinForgot = true; render(); return true; } setRenew(true); C.loginErr = "Kullanıcı adın ve şifrenle gir; sonra yeni PIN seçeceksin."; await doLogout(true); return true; }
  if (a==="pinForgotCancel"){ S.pinForgot = false; render(); return true; }
  if (a==="pinForgotForce"){ setRenew(true); C.loginErr = "Kullanıcı adın ve şifrenle gir; sonra yeni PIN seçeceksin."; await doLogout(true); return true; }
  if (a==="pinKey"){
    if (!pinOn()){ S.locked = false; render(); return true; }
    const cfg = pinCfg();
    if (Math.max(cfg?.coolUntil||0, S.pinCoolUntil||0) > Date.now() || S.pinBusy) return true;
    const k = t.dataset.k; S.pinErr = null;
    if (k==="del"){ S.pinBuf = (S.pinBuf||"").slice(0,-1); render(); return true; }
    if ((S.pinBuf||"").length >= 4) return true;
    S.pinBuf = (S.pinBuf||"") + k; render();
    if (S.pinBuf.length < 4) return true;
    const pin = S.pinBuf; S.pinBuf = "";
    const unlock = () => { S.locked = false; S.pinCoolUntil = 0; markActive(true); render(); };
    // 1) internet varsa sunucuda doğrula (deneme sayısı da orada tutulur)
    let r = null;
    if (SB && C.online !== false && navigator.onLine !== false){
      S.pinBusy = true; render();
      try{ const res = await SB.rpc("verify_my_pin", {p_pin:pin}); if (res.error) throw res.error; r = res.data; }
      catch(e){ r = null; if (!isNetErr(e)){ S.pinBusy = false; S.pinErr = sbMsg(e); render(); return true; } }
      S.pinBusy = false;
    }
    if (r){
      if (r.ok){ if (r.mins && C.ctx) C.ctx.pin_mins = r.mins; await pinRemember(pin, r.set_at || C.ctx?.pin_set_at); unlock(); return true; }
      if (r.reason==="none"){ S.locked = false; await afterLogin({id:C.user.id}); return true; }  // PIN silinmiş (şifre yenilendi): yeniden belirlenecek
      if (r.reason==="cool"){ S.pinCoolUntil = Date.now() + (r.wait||300)*1000; render(); return true; }
      if (r.reason==="max"){ await pinTooMany(); return true; }
      await pinFail(cfg, r.left); return true;
    }
    // 2) internet yok: telefondaki kopyayla
    if (!cfg){ S.pinErr = "PIN'i kontrol etmek için internet gerekiyor. Bağlanıp tekrar dene."; render(); return true; }
    if ((await pinHash(pin, cfg.salt)) === cfg.hash){ cfg.fails = 0; cfg.coolUntil = 0; pinSave(cfg); unlock(); return true; }
    cfg.fails = (cfg.fails||0) + 1;
    if (cfg.fails >= PIN_MAX){ cfg.fails = 0; pinSave(cfg); await pinTooMany(); return true; }
    pinSave(cfg); await pinFail(cfg, PIN_MAX - cfg.fails); return true;
  }
  return false;
}

  catch(e){ S.msg = {kind:"bad", text: isNetErr(e) ? "Süreyi değiştirmek için internet gerekiyor." : sbMsg(e)}; }
  render(true); });

async function rpc(name, args, okText){
  try{ const {data, error} = await SB.rpc(name, args); if (error) throw error; if (okText) S.msg = {kind:"ok", text:okText}; return (data===null || data===undefined || data==="") ? true : data; }
  catch(e){ S.msg = {kind:"bad", text:sbMsg(e)}; return null; }
}

    ${p.temp==="waiting" ? ` <span class="pill warn">geçici şifre bekliyor</span>` : p.temp==="expired" ? ` <span class="pill bad">geçici şifrenin süresi doldu</span>` : ""}</div>
    ${canManage ? `<div class="row">${S.resetFor===p.user_id ? "" : `<button class="link" data-act="resetOpen" data-id="${p.user_id}">Şifre yenile</button>`}

  h += `<section class="card stack"><div class="row between"><h2>Yönetici paneli</h2><button class="link" data-act="ovRefresh">Yenile</button></div>
    <p class="small muted">Dükkânları ve hesapları buradan yönetirsin. Dükkânların kayıtlarının içeriğini göremezsin; sadece ne kadar kullanıldığını görürsün.</p>

  h += ov.map(s=>`<section class="card stack ${s.active?"":"paused"}">
      <div class="row between"><h3>${esc(s.name)}</h3><span class="pill ${s.active?"ok":"bad"}">${s.active?"Açık":"Durduruldu"}</span></div>

        ${(C.ctx.shops||[]).some(x=>x.id===s.id) && C.shop?.id!==s.id ? `<button class="link" data-act="pickShop" data-id="${s.id}">Bu dükkâna geç</button>` : ""}

const VIEW_KEY = "bd-gorunum";
const adminView = () => { try{ return localStorage.getItem(VIEW_KEY); }catch(_){ return null; } };
function setAdminView(v){ try{ if (v) localStorage.setItem(VIEW_KEY, v); else localStorage.removeItem(VIEW_KEY); }catch(_){} }
function enterAdmin(){
  if (RT && SB) try{ SB.removeChannel(RT); }catch(_){} RT = null;
  if (C.shop){ clearData(); C.lastSync = null; C.by = {}; C.people = []; }
  C.shop = null; setStore(cloudStore()); S.mode = "cloud"; S.admin = true; S.guide = false; S.editId = null; C.ready = true;
  if (!String(S.tab).startsWith("y-")) S.tab = "y-ozet";
  cloudSaveNow(); render(); loadOverview();
}
function needOverview(){ if (!C.overview && !C.ovLoading){ C.ovLoading = true; setTimeout(()=>loadOverview().finally(()=>{ C.ovLoading = false; }), 0); } }
const msgBox = () => S.msg ? `<div class="notice ${S.msg.kind||"ok"}">${esc(S.msg.text)}</div>` : "";
const daysAgo = t => t ? (Date.now() - new Date(t).getTime()) / DAY : Infinity;
function viewAdminHome(){
  needOverview();
  const ov = C.overview, sg = C.signups || [], ctx = C.ctx || {};
  const first = String(ctx.full_name || ctx.username || "").split(" ")[0];
  let h = msgBox() + `<section class="card stack adhero"><span class="small muted">Yönetici</span><h2>Merhaba ${esc(first)}</h2>
    <p class="small muted">Dükkânların durumu bir bakışta. Dükkânların kayıtlarının içeriğini görmezsin; sadece ne kadar kullanıldığını görürsün.</p></section>`;
  if (!ov) return h + `<p class="small muted">Yükleniyor…</p>`;
  const act = ov.filter(s=>s.active), week = ov.filter(s=>daysAgo(s.last_write) < 7);
  h += `<div class="tiles adtiles">
    <button class="tile" data-act="adTab" data-tab="y-dukkan"><span class="tn num">${ov.length}</span><span>dükkân</span></button>
    <button class="tile" data-act="adTab" data-tab="y-dukkan"><span class="tn num">${act.length}</span><span>açık</span></button>
    <button class="tile" data-act="adTab" data-tab="y-dukkan"><span class="tn num">${week.length}</span><span>bu hafta kullanan</span></button>
    <button class="tile ${sg.length?"warn":""}" data-act="adTab" data-tab="y-basvuru"><span class="tn num">${sg.length}</span><span>bekleyen başvuru</span></button></div>`;
  if (sg.length) h += `<div class="notice ok row between"><span><b>${sg.length} kayıt başvurusu</b> onayını bekliyor.</span><button class="primary" data-act="adTab" data-tab="y-basvuru">Bak</button></div>`;
  const warn = [];
  ov.forEach(s=>{
    if (!s.active) warn.push([s, "Durduruldu", "bad"]);
    else if (!s.last_write && daysAgo(s.created_at) > 3) warn.push([s, "Açılalı " + Math.floor(daysAgo(s.created_at)) + " gün oldu, hiç kayıt girilmedi", "warn"]);
    else if (s.last_write && daysAgo(s.last_write) >= 7) warn.push([s, Math.floor(daysAgo(s.last_write)) + " gündür kayıt girilmedi", "warn"]);
    (s.members||[]).forEach(p=>{ if (p.temp==="expired") warn.push([s, `${p.full_name||p.username}: geçici şifrenin süresi doldu`, "bad"]);
      else if (p.temp==="waiting") warn.push([s, `${p.full_name||p.username}: geçici şifreyle henüz girmedi`, "warn"]); });
  });
  h += `<section class="card stack"><h2>Dikkat edilecekler</h2>${warn.length ? warn.map(([s,t,k])=>`<div class="prow"><div class="row between"><b>${esc(s.name)}</b><span class="pill ${k}">${k==="bad"?"Önemli":"Bak"}</span></div><span class="small muted">${esc(t)}</span></div>`).join("")
    : `<p class="small muted">Her şey yolunda. Takılan dükkân yok.</p>`}</section>`;
  const recent = ov.filter(s=>s.last_write).sort((a,b)=>new Date(b.last_write)-new Date(a.last_write)).slice(0,5);
  h += `<section class="card stack"><h2>Son hareketler</h2>${recent.length ? recent.map(s=>`<div class="row between prow" style="flex-direction:row"><span><b>${esc(s.name)}</b><br><span class="small muted">${s.products} ürün · ${s.events} kayıt</span></span><span class="small muted">${agoShort(s.last_write)}</span></div>`).join("")
    : `<p class="small muted">Henüz hiçbir dükkân kayıt girmedi.</p>`}</section>`;
  h += `<section class="card stack"><h2>Hızlı işlemler</h2><div class="row"><button data-act="newShopOpen">${ic("plus",18)} Yeni dükkân aç</button><button data-act="ovRefresh">Yenile</button></div></section>`;
  return h;
}

// İnternetsiz açılıp sonradan bağlanınca: girişi tamamla (canlı eşitleme dahil), bekleyenleri gönder, kaçanları al
async function resync(){
  if (!SB || !["cloud","paused"].includes(S.mode)) return;
  C.online = true;
  if (S.admin && C.ready){ SB.rpc("my_context").then(r=>{ if (r && r.data){ C.ctx = r.data; pinSync(); cloudSave();
      if (r.data.must_change || r.data.has_pin === false || !r.data.is_admin){ afterLogin({id:C.user.id}).catch(()=>{}); return; } renderData(); } }, ()=>{});
    loadOverview(); return; }
  if (!C.ready){ try{ const s = (await SB.auth.getSession()).data.session; if (s) await afterLogin(s.user); }catch(e){ if (isNetErr(e)) C.online = false; } saving(); return; }
  flush(); pull().then(n=>{ if (n) renderData(); }, ()=>{});
  SB.rpc("my_context").then(r=>{ if (r && r.data){ C.ctx = r.data; pinSync(); cloudSave();
    if (r.data.must_change || r.data.has_pin === false){ afterLogin({id:C.user.id}).catch(()=>{}); return; } renderData(); } }, ()=>{});
}

/* ---------- Satış (kasa): barkodla satış, peşin / kart / veresiye, kasa hareketleri ---------- */
// Satış kaydı (tür "sale"): {id, d, it:[{p,n,q,u,b,w}], tot, pay, c, al, r (iade), x (iptal), ev (veresiye kaydı)}
// Kasa kaydı  (tür "cash"): {id, d, t: acilis|giris|cikis|kapanis, a, r (sebep), n (not), say, birak}
const POS_KEEP_DAYS = 35, POS_RATE_DAYS = 28;
if (!Array.isArray(S.sales)) S.sales = [];
if (!Array.isArray(S.cash)) S.cash = [];
const PAY = {nakit:"Nakit", kart:"Kart", veresiye:"Veresiye"};
const CASH_T = {acilis:"Açılış Parası", giris:"Kasaya Giriş", cikis:"Kasadan Çıkış", kapanis:"Gün Kapanışı"};
const OUT_REASONS = ["Toptancı / plasiyer ödemesi","Ekmekçi","Fatura (elektrik, su, telefon)","Kira","Personel / yevmiye","Çay, yemek","Bankaya yatırıldı","Kendime aldım","Diğer"];
const IN_REASONS = ["Bozuk para / para eklendi","Bankadan çekildi","Borç ödemesi (deftersiz)","Diğer"];
const r2 = n => Math.round((Number(n)||0)*100)/100;
const r3 = n => Math.round((Number(n)||0)*1000)/1000;
const pnum = v => { let s = String(v ?? "").trim().replace(/\s/g,"").replace(/TL$/i,""); if (s==="") return NaN;
  if (/^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,"");   // 1.500 / 1.500,50 → binlik ayraç
  const n = Number(s.replace(",", ".")); return isFinite(n) ? n : NaN; };
const posCutoffT = () => today0() - POS_KEEP_DAYS*DAY;
const posCloud = () => S.mode==="cloud";
const tOf = x => Date.parse(x.d);
const hhmm = t => new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
const qtyTxt = (q, w) => w ? fmt(q, 3) + " kg" : fmt(q, 3);
let salesVer = 0; const salesTouch = () => { salesVer++; };

/* --- satış dizini: ürün başına satılan miktar (hızlı toplam için) --- */
let posIdx = null, posIdxSig = "";
function posIndex(){
  const sig = S.sales.length + ":" + salesVer;
  if (posIdx && posIdxSig === sig) return posIdx;
  const m = new Map();
  for (const s of S.sales){ if (s.x) continue; const t = tOf(s);
    for (const it of (s.it||[])){ if (!it.p || it.p==="-") continue; let a = m.get(it.p); if (!a){ a = []; m.set(it.p, a); } a.push([t, Number(it.q)||0]); } }
  for (const a of m.values()){ a.sort((x,y)=>x[0]-y[0]); let acc = 0; for (let i=a.length-1;i>=0;i--){ acc += a[i][1]; a[i][2] = acc; } }
  posIdx = m; posIdxSig = sig; return m;
}
const POS_NEED = new Set();
function posSoldSince(pid, fromT){
  const a = posIndex().get(pid);
  const cut = posCloud() ? posCutoffT() : -Infinity;
  const lo = Math.max(fromT, cut);
  let local = 0;
  if (a && a.length){ let L = 0, H = a.length; while (L < H){ const M = (L+H)>>1; if (a[M][0] < lo) L = M+1; else H = M; } local = L < a.length ? a[L][2] : 0; }
  if (fromT >= cut) return local;
  const key = pid + "|" + new Date(fromT).toISOString();
  const po = S.cloud?.posOld, old = po && po.cut===new Date(cut).toISOString() ? po.v?.[key] : null;
  if (old == null){ POS_NEED.add(key); return local; }
  return local + Number(old);
}
// Satılan + reçetede kullanılan (tost satılınca ekmek ve kaşar da düşer)
function posUse(pid, fromT, depth){
  let q = posSoldSince(pid, fromT);
  if ((depth||0) < 3) for (const m of S.products) if (isMade(m)) for (const r of m.recipe) if (r.id===pid) q += posUse(m.id, fromT, (depth||0)+1) * (Number(r.qty)||0);
  return q;
}
// stats() içinden: satışa geçildiyse rafta kalan kesin, satış hızı gerçek
function posFor(p, ev, anchors, now){
  const ps = S.settings?.posStart; if (!ps) return null;
  const pst = Date.parse(ps); if (!isFinite(pst)) return null;
  const LA = anchors.length ? anchors[anchors.length-1] : null;
  let exact = null;
  if (LA && LA.t >= pst - 60000){
    let s0 = LA.q;
    for (const e of ev){ const t = Date.parse(e.date);
      if (e.type==="gelen" && t >= LA.t) s0 += e.qty;
      else if ((e.type==="fire"||e.type==="ariza"||e.type==="iade") && t > LA.t) s0 -= e.qty; }
    exact = s0 - posUse(p.id, LA.t);
  }
  let rate = null;
  const from = Math.max(pst, now - POS_RATE_DAYS*DAY), spanD = (now - from)/DAY;
  if (spanD >= 7){
    let off = 0;
    for (const e of ev){ if (e.type!=="bos") continue; const t = Date.parse(e.date), b0 = t - (e.days||0)*DAY; off += Math.max(0, Math.min(t, now) - Math.max(b0, from)); }
    if (p.outSince) off += Math.max(0, now - Math.max(Date.parse(p.outSince), from));
    rate = Math.max(0, posUse(p.id, from)) / Math.max(1, spanD - off/DAY);
  }
  return {exact, rate};
}

/* --- barkod --- */
const cleanCode = s => String(s||"").replace(/[^\dA-Za-z\-]/g, "");
function findByBarcode(code){
  for (const p of S.products) for (const b of (p.barcodes||[])) if (b.c===code) return {p, q: Number(b.q)||1, koli: (Number(b.q)||1) > 1};
  return null;
}
function scalePrefixes(){ return String(S.settings?.scalePre ?? "27,28,29").split(/[^\d]+/).filter(Boolean); }
function scaleParse(code){
  if (!/^\d{13}$/.test(code) || !scalePrefixes().some(x=>code.startsWith(x))) return null;
  const plu = String(Number(code.slice(2,7))), val = Number(code.slice(7,12));
  const p = S.products.find(x=>x.plu!=null && x.plu!=="" && String(Number(x.plu))===plu);
  if (!p) return {plu, unknown:true};
  if ((S.settings?.scaleMode||"w")==="p"){ const price = val/100, u = Number(p.salePrice)||0; return {p, q: u>0 ? r3(price/u) : 1, u: u>0 ? u : price}; }
  return {p, q: r3(val/1000)};
}
function buyOf(p, depth){
  if (!p) return null;
  if (isMade(p)){ if ((depth||0) > 3) return null; let s = 0; for (const r of p.recipe){ const c = S.products.find(x=>x.id===r.id); const b = buyOf(c, (depth||0)+1); if (b==null) return null; s += b*(Number(r.qty)||0); } return r2(s); }
  let best = null, t0 = 0;
  for (const e of S.events) if (e.productId===p.id && e.type==="gelen" && e.price>0){ const t = Date.parse(e.date); if (t > t0){ t0 = t; best = e.price; } }
  return best ?? (Number(p.buyPrice) > 0 ? Number(p.buyPrice) : null);
}

/* --- sepet --- */
const CART_KEY = "bd-sepet";
function cartLoad(){ try{ const c = JSON.parse(localStorage.getItem(CART_KEY)||"null"); if (c && Array.isArray(c.items)) return c; }catch(_){} return {items:[], cust:null, ret:false}; }
S.pos = cartLoad();
function cartSave(){ try{ localStorage.setItem(CART_KEY, JSON.stringify({items:S.pos.items, cust:S.pos.cust, ret:S.pos.ret})); }catch(_){} }
function cartTotal(){ return r2(S.pos.items.reduce((a,x)=>a + (Number(x.q)||0)*(Number(x.u)||0), 0)); }
function cartAdd(p, q, u, opt){
  opt = opt || {};
  const w = !!(p?.byWeight || opt.w), price = u != null ? Number(u) : (Number(p?.salePrice)||0);
  const pid = p ? p.id : null, items = S.pos.items;
  const same = !w && items.find(x=>x.p===pid && !x.w && Number(x.u)===price && (pid || x.n===(opt.n||"Diğer")));
  if (same){ same.q = r3(Number(same.q) + q); items.splice(items.indexOf(same), 1); items.unshift(same); S.pos.flash = same.k; }
  else { const k = newId(); items.unshift({k, p:pid, n: p ? p.name : (opt.n||"Diğer"), q: r3(q), u: price, w}); S.pos.flash = k; }
  if (p && !(Number(p.salePrice) > 0) && u == null) S.posWarn = `${p.name} için satış fiyatı girilmemiş. Sepette fiyatına dokunup yaz; ürünü düzenleyip de kaydedebilirsin.`;
  cartSave();
}
function posFocus(){ setTimeout(()=>{ if (S.posEditK) return; const a = document.activeElement; if (a && a!==document.body && a.id!=="pos-scan" && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return; document.getElementById("pos-scan")?.focus(); }, 0); }
function posScan(raw){
  const txt = String(raw||"").trim(); if (!txt) return;
  S.posErr = null; S.posWarn = null; S.posUnknown = null;
  // "3*barkod" ya da "3x barkod": adetli okutma
  let mult = 1, code = txt; const mm = txt.match(/^(\d+(?:[.,]\d+)?)\s*[*xX×]\s*(.+)$/);
  if (mm){ mult = pnum(mm[1]) || 1; code = mm[2].trim(); }
  const c = cleanCode(code);
  if (/^\d{4,}$/.test(c)){
    const hit = findByBarcode(c);
    if (hit){ cartAdd(hit.p, mult * hit.q); S.posQ = ""; return; }
    const sc = scaleParse(c);
    if (sc && !sc.unknown){ cartAdd(sc.p, sc.q * mult, sc.u, {w:true}); S.posQ = ""; return; }
    S.posUnknown = {code: c, plu: sc?.plu || null}; S.posQ = ""; return;
  }
  const L = posSearch(code);
  if (L.length===1){ addFromSearch(L[0], mult); S.posQ = ""; return; }
  S.posQ = code;
}
function addFromSearch(p, mult){ if (p.byWeight){ S.posWeigh = p.id; return; } cartAdd(p, mult||1); }
function posSearch(q){
  const n = norm(q); if (!n) return [];
  const words = n.split(" ");
  return S.products.filter(p=>{ const h = norm(p.name + " " + (p.aliases||[]).join(" ")); return words.every(w=>h.includes(w)); })

/* --- kasa hesabı --- */
function dayRange(t0){ return [t0, t0 + DAY]; }
function kasaDay(t0){
  const [a, b] = dayRange(t0), inDay = x => { const t = tOf(x); return t >= a && t < b; };
  const sales = S.sales.filter(s=>!s.x && inDay(s));
  const sum = (arr, f) => r2(arr.reduce((acc,x)=>acc + f(x), 0));
  const cash = S.cash.filter(inDay).sort((x,y)=>x.d.localeCompare(y.d));
  const acil = cash.filter(x=>x.t==="acilis").pop();
  const kap = cash.filter(x=>x.t==="kapanis").pop();
  const tahsil = S.events.filter(e=>e.type==="odeme" && (t=>t>=a&&t<b)(Date.parse(e.date)));
  const r = {
    acilis: acil ? Number(acil.a)||0 : 0, acilisSet: !!acil,
    nakit: sum(sales.filter(s=>(s.pay||"nakit")==="nakit"), s=>s.tot), kart: sum(sales.filter(s=>s.pay==="kart"), s=>s.tot),
    veresiye: sum(sales.filter(s=>s.pay==="veresiye"), s=>s.tot), tahsilat: sum(tahsil, e=>Number(e.amount)||0),
    giris: sum(cash.filter(x=>x.t==="giris"), x=>x.a), cikis: sum(cash.filter(x=>x.t==="cikis"), x=>x.a),
    fis: sales.filter(s=>!s.r).length, iade: sum(sales.filter(s=>s.r), s=>s.tot), ciro: sum(sales, s=>s.tot), cash, kap, sales };
  r.beklenen = r2(r.acilis + r.nakit + r.tahsilat + r.giris - r.cikis);
  return r;
}
function prevLeft(t0){ const prev = S.cash.filter(x=>x.t==="kapanis" && tOf(x) < t0).sort((x,y)=>x.d.localeCompare(y.d)).pop(); return prev && prev.birak!=null ? Number(prev.birak) : null; }

async function posFinish(pay){
  const items = S.pos.items.filter(x=>Number(x.q) && isFinite(Number(x.q)));
  if (!items.length) return;
  const ret = !!S.pos.ret, sign = ret ? -1 : 1, cust = S.pos.cust || null;
  if (pay==="veresiye" && !cust){ S.posPick = true; S.posErr = "Veresiye için müşteri seç (ya da yeni müşteri ekle)."; render(); return; }
  if (items.some(x=>!(Number(x.u) > 0))){ S.posErr = "Fiyatı olmayan ürün var. Sepette fiyatını yaz."; render(); return; }
  const it = items.slice().reverse().map(x=>{ const p = x.p ? S.products.find(y=>y.id===x.p) : null, b = buyOf(p);
    return {p: x.p || "-", n: x.n, q: r3(sign*Math.abs(Number(x.q))), u: r2(x.u), ...(b!=null ? {b} : {}), ...(x.w ? {w:1} : {})}; });
  const tot = r2(it.reduce((a,x)=>a + x.q*x.u, 0)), given = pnum(S.posGiven);
  const sale = {id: newId(), d: nowIso(), it, tot, pay, ...(cust ? {c: cust} : {}), ...(ret ? {r: true} : {}), ...(pay==="nakit" && given > 0 && !ret ? {al: r2(given)} : {})};
  try{
    await posMarkStart();
    if (pay==="veresiye"){ sale.ev = newId();
      await store.addEvent({id: sale.ev, type:"borc", productId:"-", customerId: cust, amount: tot, date: sale.d, saleId: sale.id,
        note: (ret ? "İade: " : "Satış: ") + it.map(x=>x.n + (Math.abs(x.q)!==1 ? " ×" + fmt(Math.abs(x.q),3) : "")).slice(0,4).join(", ") + (it.length>4 ? " …" : "")}); }
    await store.saveSale(sale);
  }catch(e){ S.posErr = "Kaydedilemedi: " + (e?.message||e); render(); return; }
  S.pos = {items:[], cust:null, ret:false}; cartSave();
  S.posLast = sale; S.posGiven = ""; S.posErr = null; S.posWarn = null; S.posPick = false; S.posClear = false; S.posUnknown = null;
  offerUndo(`${ret?"İade":"Satış"} kaydedildi: ${TLx(tot)} ${PAY[pay].toLocaleLowerCase("tr")}.`, ()=>posCancel(sale.id, true));
  render(); posFocus();
}
async function posCancel(id, undo){
  const s = S.sales.find(x=>x.id===id); if (!s || s.x) return;
  await store.saveSale({...s, x: true, xAt: nowIso()});
  if (s.ev && S.events.some(e=>e.id===s.ev)) await store.deleteEvent(s.ev);
  if (undo && S.posLast?.id===id) S.posLast = null;
  S.msg = {kind:"ok", text:`${hhmm(tOf(s))} satışı iptal edildi; stok ve kasa düzeltildi.`};
  render();
}

  const x = {id: newId(), d: nowIso(), t: f, a: r2(a), ...(r ? {r} : {}), ...(n ? {n} : {})};
  if (f==="kapanis"){ const k = kasaDay(today0()); x.say = r2(a); x.beklenen = k.beklenen; x.fark = r2(a - k.beklenen); if (b >= 0) x.birak = r2(b); }
  await posMarkStart();
  await store.saveCash(x);
  S.kasaForm = null;
  S.msg = {kind:"ok", text: f==="kapanis" ? (Math.abs(x.fark)<0.01 ? "Gün kapatıldı. Kasa tuttu." : `Gün kapatıldı. Kasa ${TLx(Math.abs(x.fark))} ${x.fark>0?"fazla":"eksik"}.`) : `${CASH_T[f]} kaydedildi: ${TLx(x.a)}${r?` (${r})`:""}.`};
  render();
}

function tanScan(raw){
  const c = cleanCode(String(raw||"").trim()); if (!c) return;
  const hit = findByBarcode(c);
  S.tan = hit ? {code:c, pid:hit.p.id, q:hit.q} : {code:c, mode:"new"};
  const sc = !hit && scaleParse(c);
  if (sc && !sc.unknown) S.tan = {code:c, pid:sc.p.id, q:1};
  render(); setTimeout(()=>{ (document.getElementById(hit ? "tp-cnt" : "tn-name") || document.getElementById("tan-scan"))?.focus(); }, 0);
}
async function addCount(p, cnt){
  if (!(cnt >= 0)) return;
  await posMarkStart();
  await store.addEvent({id:newId(), type:"sayim", productId:p.id, qty:cnt, date:nowIso()});
  if (p.outSince && cnt > 0) await store.saveProduct({...S.products.find(x=>x.id===p.id), outSince:null});
}
function barcodeOwner(code, exceptId){ for (const p of S.products) if (p.id!==exceptId && (p.barcodes||[]).some(b=>b.c===code)) return p; return null; }

async function posAct(a, t){
  if (a && a.startsWith("rp") || a==="goRapor") return rpAct(a, t);
  const k = t.dataset.k;
  if (a==="goKasa"){ S.tab = "satis"; S.posView = "kasa"; S.msg = null; render(); window.scrollTo(0,0); return true; }
  if (a==="posView"){ S.posView = t.dataset.v; S.msg = null; S.kasaForm = null; S.tan = null; render(); if (S.posView==="sat") posFocus(); if (S.posView==="tanit") setTimeout(()=>document.getElementById("tan-scan")?.focus(),0); return true; }
  if (a==="posPick"){ const p = S.products.find(x=>x.id===t.dataset.id); if (p){ S.posQ = ""; S.posWarn = null; addFromSearch(p, 1); } render(); if (S.posWeigh) setTimeout(()=>document.getElementById("pw-kg")?.focus(),0); else posFocus(); return true; }
  if (a==="posEditPrice"){ S.posEditK = k; render(); setTimeout(()=>{ const e = document.getElementById("pos-ep"); if (e){ e.focus(); e.select(); } },0); return true; }
  if (a==="posQ"){ const x = S.pos.items.find(y=>y.k===k); if (x){ x.q = r3(Number(x.q) + Number(t.dataset.d)); if (x.q <= 0) S.pos.items = S.pos.items.filter(y=>y!==x); cartSave(); } render(); posFocus(); return true; }
  if (a==="posDel"){ S.pos.items = S.pos.items.filter(y=>y.k!==k); cartSave(); render(); posFocus(); return true; }
  if (a==="posClear"){ if (!S.posClear){ S.posClear = true; render(); return true; } S.pos = {items:[], cust:null, ret:false}; S.posClear = false; cartSave(); render(); posFocus(); return true; }
  if (a==="posRet"){ S.pos.ret = !S.pos.ret; cartSave(); render(); posFocus(); return true; }
  if (a==="posPay"){ await posFinish(t.dataset.pay); return true; }
  if (a==="posGiven"){ S.posGiven = t.dataset.v; render(); posFocus(); return true; }
  if (a==="posCustOpen"){ S.posPick = !S.posPick; S.posNewCust = false; render(); if (S.posPick) setTimeout(()=>document.getElementById("pos-cq")?.focus(),0); return true; }
  if (a==="posCustClose"){ S.posPick = false; render(); posFocus(); return true; }
  if (a==="posCust"){ S.pos.cust = t.dataset.id || null; S.posPick = false; S.posErr = null; cartSave(); render(); posFocus(); return true; }
  if (a==="posNewCust"){ S.posNewCust = t.dataset.v==="1"; render(); if (S.posNewCust) setTimeout(()=>document.getElementById("pc-name")?.focus(),0); return true; }
  if (a==="posUnknownClose"){ S.posUnknown = null; S.posPrice = false; render(); posFocus(); return true; }
  if (a==="posTanitThis"){ const c = S.posUnknown?.code; S.posUnknown = null; S.posView = "tanit"; S.tan = {code:c, mode:"new"}; S.tanBack = true; render(); setTimeout(()=>document.getElementById("tn-name")?.focus(),0); return true; }
  if (a==="posPriceOpen"){ S.posPrice = true; render(); setTimeout(()=>document.getElementById("pp-u")?.focus(),0); return true; }
  if (a==="posPriceClose"){ S.posPrice = false; render(); posFocus(); return true; }
  if (a==="posWeighClose"){ S.posWeigh = null; render(); posFocus(); return true; }
  if (a==="posDay"){ S.posDay = Math.max(0, Number(t.dataset.v)||0); S.posOpen = null; render(); return true; }
  if (a==="posOpen"){ S.posOpen = S.posOpen===t.dataset.id ? null : t.dataset.id; S.posXc = null; render(); return true; }
  if (a==="posCancel"){ const id = t.dataset.id; if (S.posXc!==id){ S.posXc = id; render(); return true; } S.posXc = null; await posCancel(id); return true; }
  if (a==="kasaForm"){ S.kasaForm = t.dataset.f || null; S.kasaErr = null; S.msg = null; render(); setTimeout(()=>document.getElementById("kf-a")?.focus(),0); return true; }
  if (a==="kasaDel"){ const id = t.dataset.id; if (S.kasaDel!==id){ S.kasaDel = id; render(); return true; } S.kasaDel = null; await store.deleteCash(id); S.msg = {kind:"ok", text:"Kasa hareketi silindi."}; render(); return true; }
  if (a==="tanClose"){ S.tan = null; const back = S.tanBack; S.tanBack = false; if (back){ S.posView = "sat"; render(); posFocus(); } else { render(); setTimeout(()=>document.getElementById("tan-scan")?.focus(),0); } return true; }
  if (a==="tanMode"){ if (S.tan) S.tan.mode = t.dataset.v; render(); return true; }
  return false;
}
async function posSubmit(id, form){
  const v = x => document.getElementById(x)?.value ?? "";
  if (id==="posform"){ posScan(v("pos-scan")); render(); if (S.posWeigh) setTimeout(()=>document.getElementById("pw-kg")?.focus(),0); else posFocus(); return true; }
  if (id==="weighform"){ const p = S.products.find(x=>x.id===S.posWeigh); let kg = pnum(v("pw-kg")); if (kg > 20 && Number.isInteger(kg)) kg = kg/1000;
    if (!(kg > 0)){ S.posErr = "Kiloyu yaz."; render(true); return true; }
    if (p) cartAdd(p, r3(kg), null, {w:true}); S.posWeigh = null; S.posErr = null; render(); posFocus(); return true; }
  if (id==="priceform"){ const u = pnum(v("pp-u")); if (!(u > 0)){ S.posErr = "Tutarı yaz."; render(true); return true; }
    cartAdd(null, 1, r2(u), {n: (v("pp-name").trim() || "Diğer")}); S.posPrice = false; S.posUnknown = null; S.posErr = null; render(); posFocus(); return true; }
  if (id==="pcform"){ const name = v("pc-name").trim(); if (!name) return true;
    const c = {id:newId(), createdAt:nowIso(), name, phone:v("pc-phone").trim(), limit:null, note:""};
    await store.saveCustomer(c); S.pos.cust = c.id; S.posPick = false; S.posNewCust = false; S.posErr = null; cartSave(); render(); posFocus(); return true; }
  if (id==="kasaform"){ await kasaSave(form.dataset.f); return true; }
  if (id==="tanform"){ tanScan(v("tan-scan")); return true; }
  if (id==="tanpform"){ const p = S.products.find(x=>x.id===form.dataset.id); if (!p) return true;
    const sale = pnum(v("tp-sale")), cnt = pnum(v("tp-cnt"));
    if (sale > 0 && sale !== Number(p.salePrice)) await store.saveProduct({...p, salePrice: r2(sale), salePriceAt: nowIso()});
    if (cnt >= 0) await addCount(p, cnt);
    S.msg = {kind:"ok", text:`${p.name} kaydedildi${cnt>=0?`; rafta ${fmt(cnt,3)} ${unitOf(p)}`:""}.`}; S.tan = null;
    if (S.tanBack){ S.tanBack = false; S.posView = "sat"; render(); posFocus(); } else { render(); setTimeout(()=>document.getElementById("tan-scan")?.focus(),0); } return true; }
  if (id==="tanbform"){ const p = S.products.find(x=>x.id===v("tb-p")); if (!p){ S.msg = {kind:"bad", text:"Bağlanacak ürünü seç."}; render(true); return true; }
    const koli = document.getElementById("tb-koli")?.checked, kq = Math.max(1, Math.round(pnum(v("tb-kq"))) || Number(p.caseSize) || 1), cnt = pnum(v("tb-cnt"));
    const code = S.tan.code, own = barcodeOwner(code, p.id); if (own){ S.msg = {kind:"bad", text:`Bu barkod zaten ${own.name} ürününde kayıtlı.`}; render(true); return true; }
    const bcs = (p.barcodes||[]).filter(b=>b.c!==code).concat([{c:code, q: koli ? kq : 1}]);
    await store.saveProduct({...p, barcodes: bcs, ...(koli && !(Number(p.caseSize)>1) ? {caseSize:kq} : {})});
    if (cnt >= 0) await addCount(p, cnt);
    S.msg = {kind:"ok", text:`Barkod ${p.name} ürününe bağlandı${koli?` (koli: ${kq})`:""}.`}; const back = S.tanBack; S.tan = null; S.tanBack = false;
    if (back){ cartAdd(S.products.find(x=>x.id===p.id), koli ? kq : 1); S.posView = "sat"; render(); posFocus(); } else { render(); setTimeout(()=>document.getElementById("tan-scan")?.focus(),0); } return true; }
  if (id==="tannform"){ const name = v("tn-name").trim(), sale = pnum(v("tn-sale")), cnt = pnum(v("tn-cnt")), buy = pnum(v("tn-buy")), w = document.getElementById("tn-w")?.checked;
    if (!name || !(sale > 0)){ S.msg = {kind:"bad", text:"Ürün adını ve satış fiyatını yaz."}; render(true); return true; }
    const code = S.tan.code, own = barcodeOwner(code); if (own){ S.msg = {kind:"bad", text:`Bu barkod zaten ${own.name} ürününde kayıtlı.`}; render(true); return true; }
    await posMarkStart();
    const p = {id:newId(), createdAt:nowIso(), aliases:[], outSince:null, recipe:null, name, supplier:v("tn-sup").trim(), initialWeekly:0, intervalDays:7, caseSize:1,
      perishable: !!document.getElementById("tn-per")?.checked, core:false, unit: w ? "kg" : "tane", everyN:1, shelfDays:null,
      initialStock: cnt >= 0 ? cnt : null, salePrice: r2(sale), salePriceAt: nowIso(), buyPrice: buy > 0 ? r2(buy) : null,
      barcodes:[{c:code, q:1}], byWeight: !!w};
    await store.saveProduct(p);
    S.msg = {kind:"ok", text:`${name} eklendi.`}; const back = S.tanBack; S.tan = null; S.tanBack = false;
    if (back){ if (w) S.posWeigh = p.id; else cartAdd(p, 1); S.posView = "sat"; render(); if (w) setTimeout(()=>document.getElementById("pw-kg")?.focus(),0); else posFocus(); }
    else { render(); setTimeout(()=>document.getElementById("tan-scan")?.focus(),0); } return true; }
  return false;
}

function prunePos(){
  if (!posCloud()) return;
  const cut = posCutoffT(), n1 = S.sales.length, n2 = S.cash.length;
  S.sales = S.sales.filter(s=>tOf(s) >= cut); S.cash = S.cash.filter(x=>tOf(x) >= cut);
  if (S.sales.length!==n1 || S.cash.length!==n2) salesTouch();
}
document.addEventListener("submit", ev=>{
  const id = ev.target.id;
  if (["posform","weighform","priceform","pcform","kasaform","tanform","tanpform","tanbform","tannform"].includes(id)){ ev.preventDefault(); posSubmit(id, ev.target).catch(e=>{ S.posErr = "Kaydedilemedi: " + (e?.message||e); render(); }); }
});
// Depolama yedeği (satış kaydı desteklemeyen eski depolar için: sadece bu oturumda)
function posMemSave(key, x){ const arr = S[key], i = arr.findIndex(y=>y.id===x.id); if (i>=0) arr[i] = {...x}; else arr.push({...x}); if (key==="sales") salesTouch(); renderData(); }
function posMemDel(key, id){ S[key] = S[key].filter(y=>y.id!==id); if (key==="sales") salesTouch(); renderData(); }

/* ---------- Satış raporları: günlük / haftalık / aylık / yıllık + Excel ---------- */
const RG = {day:"Günlük", week:"Haftalık", month:"Aylık", year:"Yıllık"};
const RP_PRE = [["bugun","Bugün","day"],["hafta","Bu Hafta","day"],["buay","Bu Ay","day"],["gecenay","Geçen Ay","day"],["buyil","Bu Yıl","month"],["12ay","Son 12 Ay","month"],["yillar","Son 3 Yıl","year"]];
const monday = t => { const d = new Date(t); d.setHours(0,0,0,0); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; };
function rpPreset(k){
  const t = new Date(today0()), Y = t.getFullYear(), M = t.getMonth(); let a = t, b = t;
  if (k==="hafta") a = monday(t);
  else if (k==="buay") a = new Date(Y, M, 1);
  else if (k==="gecenay"){ a = new Date(Y, M-1, 1); b = new Date(Y, M, 0); }
  else if (k==="buyil") a = new Date(Y, 0, 1);
  else if (k==="12ay") a = new Date(Y, M-11, 1);
  else if (k==="yillar") a = new Date(Y-2, 0, 1);
  return {from: ymd(a.getTime()), to: ymd(b.getTime())};
}
function rpState(){ if (!S.rp){ const r = rpPreset("hafta"); S.rp = {g:"day", from:r.from, to:r.to, pre:"hafta"}; } return S.rp; }
const ymdLocalT = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1).getTime(); };
function rpKey(t, g){ const d = new Date(t);
  if (g==="week") return ymd(monday(t).getTime());
  if (g==="month") return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-01";
  if (g==="year") return d.getFullYear() + "-01-01";
  return ymd(t); }
function rpLabel(k, g){ const t = ymdLocalT(k), d = new Date(t);
  if (g==="week"){ const e = new Date(t + 6*DAY); return `${d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"})}`; }
  if (g==="month") return d.toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  if (g==="year") return String(d.getFullYear());
  return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric",weekday:"short"}); }
// Telefondaki kayıtlarla rapor (internet yokken ya da bulut dışı kullanımda)
function reportLocal(fromT, toT, g){
  const inR = t => t >= fromT && t < toT;
  const sales = S.sales.filter(s=>!s.x && inR(tOf(s))), cash = S.cash.filter(x=>inR(tOf(x))).sort((a,b)=>a.d.localeCompare(b.d));
  const odeme = S.events.filter(e=>e.type==="odeme" && inR(Date.parse(e.date)));
  const per = {}, P = k => (per[k] ||= {k, fis:0, ciro:0, iade:0, nakit:0, kart:0, veresiye:0, maliyet:0, ciro_bilinen:0, tahsilat:0, giris:0, cikis:0});
  const prod = {};
  for (const s of sales){ const x = P(rpKey(tOf(s), g)), tot = Number(s.tot)||0;
    if (!s.r) x.fis++; else x.iade += tot; x.ciro += tot; x[(s.pay||"nakit")] += tot;
    for (const it of (s.it||[])){ const q = Number(it.q)||0, u = Number(it.u)||0, b = it.b==null ? null : Number(it.b);
      if (b!=null){ x.maliyet += q*b; x.ciro_bilinen += q*u; }
      const pr = (prod[it.p] ||= {p:it.p, n:it.n, q:0, ciro:0, maliyet:0, eksik:false}); pr.n = it.n; pr.q += q; pr.ciro += q*u; if (b!=null) pr.maliyet += q*b; else pr.eksik = true; } }
  for (const e of odeme) P(rpKey(Date.parse(e.date), g)).tahsilat += Number(e.amount)||0;
  for (const c of cash) if (c.t==="giris"||c.t==="cikis") P(rpKey(tOf(c), g))[c.t] += Number(c.a)||0;
  const reasons = {}; for (const c of cash) if (c.t==="giris"||c.t==="cikis"){ const k = c.t + "|" + (c.r||"Diğer"); const r = (reasons[k] ||= {t:c.t, r:c.r||"Diğer", a:0, adet:0}); r.a += Number(c.a)||0; r.adet++; }
  return {group:g, local:true, periods:Object.values(per).sort((a,b)=>a.k.localeCompare(b.k)), products:Object.values(prod).sort((a,b)=>b.ciro-a.ciro),
    cash: cash.map(c=>({d:c.d, t:c.t, a:c.a, r:c.r||null, n:c.n||null, say:c.say??null})), reasons:Object.values(reasons).sort((a,b)=>a.t.localeCompare(b.t) || b.a-a.a)};
}
async function rpLoad(){
  const R = rpState(), fromT = ymdLocalT(R.from), toT = ymdLocalT(R.to) + DAY;
  if (!(toT > fromT)){ S.rpErr = "Bitiş tarihi başlangıçtan önce olamaz."; render(); return; }
  S.rpBusy = true; S.rpErr = null; render();
  try{
    let d;
    if (posCloud() && SB && S.cloud?.shop){
      try{ const {data, error} = await SB.rpc("pos_report", {p_shop:S.cloud.shop.id, p_from:new Date(fromT).toISOString(), p_to:new Date(toT).toISOString(), p_group:R.g});
        if (error) throw error; d = data; }
      catch(e){ if (!isNetErr(e)) throw e; if (fromT < posCutoffT()) throw new Error("İnternet yok. Son " + POS_KEEP_DAYS + " günden eskisi için internet gerekiyor."); d = reportLocal(fromT, toT, R.g); d.offline = true; }
    } else d = reportLocal(fromT, toT, R.g);
    S.rpData = {...d, from:R.from, to:R.to, g:R.g};
  }catch(e){ S.rpErr = "Rapor alınamadı: " + (e?.message||e); }
  S.rpBusy = false; render();
}
function rpSum(d){
  const T = {fis:0, ciro:0, iade:0, nakit:0, kart:0, veresiye:0, maliyet:0, ciro_bilinen:0, tahsilat:0, giris:0, cikis:0};
  for (const p of d.periods) for (const k in T) T[k] += Number(p[k])||0;
  for (const k in T) T[k] = r2(T[k]);
  T.kar = r2(T.ciro_bilinen - T.maliyet); return T;
}

  let h = `<section class="card stack"><h2>Satış Raporu</h2>
    <div class="fchips">${RP_PRE.map(([k,l])=>`<button class="tog ${R.pre===k?"on":""}" data-act="rpPre" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="grid2"><label>Başlangıç<input id="rp-from" type="date" value="${esc(R.from)}"></label><label>Bitiş<input id="rp-to" type="date" value="${esc(R.to)}"></label></div>
    <div class="row" role="group" aria-label="Gruplama">${Object.entries(RG).map(([k,l])=>`<button class="tog ${R.g===k?"on":""}" data-act="rpG" data-g="${k}">${l}</button>`).join("")}</div>
    <button class="primary" data-act="rpGo" ${S.rpBusy?"disabled":""}>${S.rpBusy?'<span class="spin"></span> Hazırlanıyor':"Raporu Göster"}</button>
    ${S.rpErr ? `<p class="notice bad">${esc(S.rpErr)}</p>` : ""}</section>`;
  if (!d) return h + `<p class="small muted">Tarih aralığını ve Günlük, Haftalık, Aylık ya da Yıllık gruplamayı seç; "Raporu Göster"e bas. Raporu Excel olarak da indirebilirsin.</p>`;
  const T = rpSum(d), eksik = (d.products||[]).filter(p=>p.eksik).length;
  h += `<section class="card stack"><div class="row between"><h2>${esc(new Date(ymdLocalT(d.from)).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}))} – ${esc(new Date(ymdLocalT(d.to)).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}))}</h2>

    <div class="tiles t4">
      <div class="tile"><span class="tn num">${TLx(T.ciro)}</span><span>toplam satış</span></div>
      <div class="tile"><span class="tn num">${fmt(T.fis)}</span><span>satış (fiş)</span></div>
      <div class="tile good"><span class="tn num">${TLx(T.kar)}</span><span>kâr${eksik?" (alış fiyatı bilinenler)":""}</span></div>
      <div class="tile"><span class="tn num">${T.fis ? TLx(r2((T.ciro - T.iade)/T.fis)) : "–"}</span><span>ortalama sepet</span></div>
      <div class="tile"><span class="tn num">${TLx(T.nakit)}</span><span>nakit</span></div>
      <div class="tile"><span class="tn num">${TLx(T.kart)}</span><span>kart</span></div>
      <div class="tile"><span class="tn num">${TLx(T.veresiye)}</span><span>veresiyeye</span></div>
      <div class="tile"><span class="tn num">${TLx(T.tahsilat)}</span><span>veresiye tahsilatı</span></div>
      <div class="tile"><span class="tn num">${TLx(T.giris)}</span><span>kasaya giriş</span></div>
      <div class="tile"><span class="tn num neg">${TLx(T.cikis)}</span><span>kasadan çıkış</span></div></div>
    ${T.iade ? `<p class="small muted">İadeler: ${TLx(T.iade)} (toplam satışa dahil).</p>` : ""}
    ${eksik ? `<p class="small muted">${eksik} ürünün alış fiyatı bilinmediği için kâra katılmadı. Fatura girildikçe ya da ürüne alış fiyatı yazılınca tamamlanır.</p>` : ""}</section>`;
  h += `<section class="card stack"><h2>${RG[d.g]} Döküm</h2><div class="tscroll"><table class="rtab"><thead><tr><th>Dönem</th><th>Fiş</th><th>Satış</th><th>Nakit</th><th>Kart</th><th>Veresiye</th><th>Kâr</th><th>Giriş</th><th>Çıkış</th></tr></thead><tbody>
    ${d.periods.map(p=>`<tr><td>${esc(rpLabel(p.k, d.g))}</td><td class="num">${fmt(p.fis)}</td><td class="num">${TLx(p.ciro)}</td><td class="num">${TLx(p.nakit)}</td><td class="num">${TLx(p.kart)}</td><td class="num">${TLx(p.veresiye)}</td><td class="num">${TLx(r2(p.ciro_bilinen - p.maliyet))}</td><td class="num">${TLx(p.giris)}</td><td class="num neg">${TLx(p.cikis)}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">Bu aralıkta kayıt yok.</td></tr>`}
    </tbody></table></div></section>`;
  const prods = d.products || [];
  h += `<section class="card stack"><h2>En Çok Satanlar</h2>${prods.length ? `<div class="tscroll"><table class="rtab"><thead><tr><th>Ürün</th><th>Miktar</th><th>Satış</th><th>Kâr</th></tr></thead><tbody>
    ${prods.slice(0, 15).map(p=>{ const pp = S.products.find(x=>x.id===p.p); return `<tr><td>${esc(p.n||"?")}</td><td class="num">${fmt(p.q, 3)} ${esc(pp ? unitOf(pp) : "")}</td><td class="num">${TLx(p.ciro)}</td><td class="num">${p.eksik ? "–" : TLx(r2(p.ciro - (p.maliyet||0)))}</td></tr>`; }).join("")}</tbody></table></div>
    ${prods.length > 15 ? `<p class="small muted">${prods.length} ürünün hepsi Excel dosyasında.</p>` : ""}` : `<p class="small muted">Satış yok.</p>`}</section>`;
